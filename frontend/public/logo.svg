<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Ascending chart line representing "投" (investment/trend) -->
  <polyline points="14,44 24,36 34,40 44,26 54,18"
            fill="none" stroke="white" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dot at the peak representing intelligence/insight -->
  <circle cx="54" cy="18" r="3.5" fill="white"/>
  <!-- Small bar elements at bottom suggesting data/analytics -->
  <rect x="14" y="48" width="6" height="4" rx="1" fill="rgba(255,255,255,0.5)"/>
  <rect x="24" y="46" width="6" height="6" rx="1" fill="rgba(255,255,255,0.6)"/>
  <rect x="34" y="44" width="6" height="8" rx="1" fill="rgba(255,255,255,0.7)"/>
  <rect x="44" y="42" width="6" height="10" rx="1" fill="rgba(255,255,255,0.85)"/>
</svg>
